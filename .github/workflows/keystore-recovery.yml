name: AAPS Authenticated Keystore Recovery
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/scripts/aaps_keystore_recovery.py'
      - '.github/workflows/keystore-recovery.yml'

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get install -y python3-cryptography
      - run: /usr/bin/python3 .github/scripts/aaps_keystore_recovery.py test
      - if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_SET: ${{ secrets.KEYSTORE_SET }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          GDRIVE_OAUTH2: ${{ secrets.GDRIVE_OAUTH2 }}
          AAPS_RECOVERY_PASSWORD: ${{ secrets.AAPS_RECOVERY_PASSWORD }}
        run: /usr/bin/python3 .github/scripts/aaps_keystore_recovery.py export
